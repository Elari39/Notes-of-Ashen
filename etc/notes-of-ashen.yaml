Name: notes-of-ashen-api
Host: 0.0.0.0
Port: 19000
Timeout: 610000

Database:
  # 必须通过 .env 或真实环境变量 APP_DATABASE_DSN 注入。
  DataSource: ""
  MaxOpenConns: 20
  MaxIdleConns: 10

Auth:
  # 必须通过 .env 或真实环境变量 APP_AUTH_ACCESS_SECRET 注入。
  AccessSecret: ""
  AccessExpire: 7200
  RefreshExpire: 604800

Redis:
  Addr: "127.0.0.1:6379"
  # 如 Redis 有密码，请通过 .env 或真实环境变量 APP_REDIS_PASSWORD 注入。
  Password: ""
  DB: 0

Search:
  Enabled: false
  MeilisearchHost: "http://127.0.0.1:7700"
  # 启用搜索时必须通过 .env 或真实环境变量 APP_MEILISEARCH_API_KEY 注入。
  MeilisearchAPIKey: ""
  MeilisearchIndex: "articles"

RabbitMQ:
  Enabled: true
  # 必须通过 .env 或真实环境变量 APP_RABBITMQ_URL 注入。
  URL: ""
  Exchange: "notes-of-ashen.events"
  Queue: "notes-of-ashen.operation_logs"
  RoutingKey: "operation.log"

Email:
  Enabled: false
  SMTPHost: "smtp.qq.com"
  SMTPPort: 465
  SMTPUsername: ""
  SMTPPassword: ""
  From: ""
  FromName: "Notes of Ashen"

AI:
  Enabled: false
  BaseURL: ""
  APIKey: ""
  Model: ""
  KeyEncryptionSecret: ""
  TimeoutSeconds: 600
  FirstByteTimeoutSeconds: 60
  StreamTimeoutSeconds: 300
  NonStreamTimeoutSeconds: 600

Proxy:
  TrustedCIDRs: ""
