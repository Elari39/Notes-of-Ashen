Name: notes-of-ashen-api
Host: 0.0.0.0
Port: 19000
Timeout: 610000

# Prometheus 指标端点（go-zero 内置）。仅 expose 不对外映射，
# 由编排环境（1Panel/内网）按需抓取。
Prometheus:
  Host: 0.0.0.0
  Port: 9101
  Path: /metrics

Database:
  # 必须通过 .env 或真实环境变量 APP_DATABASE_DSN 注入。
  DataSource: ""
  MaxOpenConns: 20
  MaxIdleConns: 10

Auth:
  # 必须通过 .env 或真实环境变量 APP_AUTH_ACCESS_SECRET 注入；该值也用于派生 AI API Key 加密密钥。
  AccessSecret: ""
  AccessExpire: 1800
  RefreshExpire: 604800

  # refreshToken 通过 HttpOnly+SameSite=Strict Cookie 下发；生产 HTTPS 保持 true，
  # 本机 dev（HTTP）需在 .env 设 APP_AUTH_COOKIE_SECURE=false，否则浏览器不会保存 Cookie。
  CookieSecure: true

# 生产环境通过 APP_REQUIRE_PUBLIC_SITE_URL=true 强制要求数据库中的 siteBaseUrl 为 HTTPS。
# 本地 Docker 默认关闭，允许通过 127.0.0.1 访问时保持 siteBaseUrl 为空。
RequirePublicSiteURL: false

Redis:
  Addr: "127.0.0.1:6379"
  # 如 Redis 有密码，请通过 .env 或真实环境变量 APP_REDIS_PASSWORD 注入。
  Password: ""
  DB: 0

Search:
  Enabled: false
  MeilisearchHost: "http://127.0.0.1:7700"
  # 启用搜索时必须通过 .env 或真实环境变量 APP_MEILISEARCH_API_KEY 注入。
  MeilisearchAPIKey: ""
  MeilisearchIndex: "articles"

# Qdrant 是 RAG 的可再生向量索引。DashScope 地址、模型和 API Key 只保存于
# 管理后台对应的 site_settings，不得通过本文件或环境变量配置。
RAG:
  Enabled: false
  QdrantURL: "http://127.0.0.1:6333"
  QdrantAPIKey: ""
  QdrantCollection: "rag_articles"

RabbitMQ:
  Enabled: false
  User: "notes_user"
  Password: ""
  # 必须通过 .env 或真实环境变量 APP_RABBITMQ_URL 注入。
  URL: ""
  Exchange: "notes-of-ashen.events"
  Queue: "notes-of-ashen.operation_logs"
  RoutingKey: "operation.log"

Email:
  Enabled: false
  SMTPHost: "smtp.qq.com"
  SMTPPort: 465
  # TLSMode: implicit(默认,465 隐式 TLS) | starttls(587 STARTTLS) | none(明文,仅内网测试)
  TLSMode: "implicit"
  SMTPUsername: ""
  SMTPPassword: ""
  From: ""
  FromName: "Notes of Ashen"

Media:
  RootDir: "./data/media"
  MaxUploadBytes: 10485760

Backup:
  MaxUploadBytes: 1073741824

Proxy:
  TrustedCIDRs: ""
