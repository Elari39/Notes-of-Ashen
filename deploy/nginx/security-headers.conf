# 基础安全响应头（集中管理，避免 nginx add_header 继承陷阱）。
# HSTS 由 1Panel 上游 HTTPS 反代统一注入。
# 本文件需在 server 块顶层及所有自带 add_header 的 location 内显式 include，
# 否则子 location 出现 add_header 会导致父级安全头全部失效。

add_header X-Content-Type-Options "nosniff" always;
add_header X-Frame-Options "SAMEORIGIN" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: https: http:; font-src 'self'; connect-src 'self'; frame-src 'none'; object-src 'none'; base-uri 'self'; form-action 'self'; manifest-src 'self'; worker-src 'self'; frame-ancestors 'self';$csp_upgrade_insecure_requests" always;
