map $http_user_agent $is_prerender_bot {
    default 0;
    ~*(googlebot|bingbot|baiduspider|yandex|duckduckbot|slurp|facebookexternalhit|twitterbot|linkedinbot|embedly|quora\ link\ preview|pinterest|slackbot|vkshare|whatsapp|telegrambot) 1;
}

map $args $is_escaped_fragment {
    default 0;
    ~(^|&)_escaped_fragment_= 1;
}

map "$is_prerender_bot$is_escaped_fragment" $should_prerender_request {
    default 0;
    ~1 1;
}

map $uri $is_prerender_asset {
    default 0;
    ~*\.(js|css|xml|less|png|jpg|jpeg|gif|pdf|doc|txt|ico|rss|zip|mp3|rar|exe|wmv|avi|ppt|mpg|mpeg|tif|wav|mov|psd|ai|xls|mp4|m4a|swf|dat|dmg|iso|flv|m4v|torrent|woff|woff2|ttf|svg|webp)$ 1;
}

map "$http_x_prerender:$should_prerender_request:$is_prerender_asset" $should_prerender {
    default 0;
    ":1:0" ${PRERENDER_ENABLED};
}

server {
    listen 8080;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;
    resolver 127.0.0.11 valid=30s ipv6=off;

    client_max_body_size 20m;

    # 仅信任直接上游（默认 Compose 网桥网关）传入的客户端地址，禁止配置宽泛公网网段。
    set_real_ip_from ${WEB_TRUSTED_PROXY_CIDR};
    real_ip_header X-Forwarded-For;
    real_ip_recursive on;

    # 隐藏 nginx 版本号。
    server_tokens off;

    # 静态文件传输与缓存优化。
    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    open_file_cache max=1000 inactive=20s;
    open_file_cache_valid 30s;
    open_file_cache_min_uses 2;
    open_file_cache_errors on;

    # 启用 gzip 压缩，减小文本类资源传输体积。
    gzip on;
    gzip_min_length 1024;
    gzip_comp_level 5;
    gzip_proxied any;
    gzip_vary on;
    gzip_types text/css text/plain application/javascript application/json image/svg+xml application/xml text/xml application/xml+rss application/atom+xml;

    # 基础安全响应头（含 CSP）；HSTS 由 1Panel 上游 HTTPS 反代统一注入。
    # 通过 snippets 集中管理，并在下方带 Cache-Control 的 location 内重复 include，
    # 避免 nginx add_header 继承陷阱（子 location 有 add_header 时父级安全头全部失效）。
    include /etc/nginx/snippets/security-headers.conf;

    # 构建源映射和恢复过程产生的暂存目录不应对外暴露。
    location ~* \.map$ {
        return 404;
    }

    # Journal、暂存和回滚目录均属于内部恢复状态，不能由静态媒体路径读取。
    location ~ ^/media/\.(restore|upload|delete)- {
        return 404;
    }

    # 内容寻址媒体与前端静态资源分卷保存，Web 容器仅以只读卷提供文件。
    location ~ ^/media/ {
        root /usr/share/nginx;
        try_files $uri =404;
        expires 1y;
        add_header Cache-Control "public, immutable";
        include /etc/nginx/snippets/security-headers.conf;
        access_log off;
    }

    # Vite 构建的静态资源文件名含 hash，可长期缓存。
    location ~* \.(js|css|woff2?|ttf|svg|png|jpg|jpeg|gif|ico|webp|avif)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        include /etc/nginx/snippets/security-headers.conf;
        access_log off;
    }

    location /api/ {
        # 基础限流：每 IP 每秒 10 请求，突发 20 不延迟，超出返回 429。
        limit_req zone=api_limit burst=20 nodelay;
        proxy_pass http://api:19000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 60s;
        proxy_send_timeout 610s;
        proxy_read_timeout 610s;
    }

    # 对外 readiness 必须反映 API、数据库、Redis 和 schema 状态，不能落入 SPA fallback。
    location = /healthz {
        proxy_pass http://api:19000/healthz;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        add_header Cache-Control "no-store";
        include /etc/nginx/snippets/security-headers.conf;
    }

    # Web 容器自身存活探针，不代表后端依赖就绪。
    location = /livez {
        access_log off;
        add_header Cache-Control "no-store";
        include /etc/nginx/snippets/security-headers.conf;
        return 204;
    }

    # 整站恢复默认允许 1 GiB 归档加少量 multipart 开销；调整后端上限时需同步修改该值。
    location = /api/v1/admin/backups/restore {
        client_max_body_size ${WEB_BACKUP_MAX_BODY_SIZE};
        limit_req zone=api_limit burst=20 nodelay;
        proxy_pass http://api:19000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 60s;
        proxy_send_timeout 610s;
        proxy_read_timeout 610s;
    }

    location = /rss.xml {
        proxy_pass http://api:19000/rss.xml;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location = /sitemap.xml {
        proxy_pass http://api:19000/sitemap.xml;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location = /index.html {
        add_header Cache-Control "no-cache";
        include /etc/nginx/snippets/security-headers.conf;
    }

    location / {
        error_page 418 = @prerender;
        if ($should_prerender = 1) {
            return 418;
        }
        try_files $uri $uri/ /index.html;
    }

    location @prerender {
        proxy_pass ${PRERENDER_SERVICE_URL}/$scheme://$host$request_uri;
        proxy_set_header X-Prerender-Token "${PRERENDER_TOKEN}";
        proxy_set_header X-Prerender-Version "nginx";
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }
}
