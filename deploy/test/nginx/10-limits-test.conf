# 仅供 scripts/test-integration.ps1 使用的限流覆盖配置。
# 集成测试中每个页面加载都会触发一次会话恢复 refresh，多个浏览器上下文并发时
# 会产生瞬时请求高峰；生产 10r/s + burst 20 会被触发（503）并打断会话恢复流程
# （曾导致 E2E 偶发失败）。测试环境大幅放宽，同时保留 zone 名以便 default.conf
# 的 limit_req 引用无需改动。生产镜像内的 10-limits.conf 不受影响。
limit_req_zone $binary_remote_addr zone=api_limit:10m rate=100r/s;
