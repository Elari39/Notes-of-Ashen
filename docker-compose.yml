# IMAGE_TAG 未设置时的 latest fallback 仅用于本地开发；生产发布必须使用不可变 tag。
name: notes-of-ashen

services:
  web:
    image: notes-of-ashen-web:${IMAGE_TAG:-latest}
    build:
      context: .
      dockerfile: Dockerfile.web
    restart: unless-stopped
    environment:
      PRERENDER_ENABLED: "${PRERENDER_ENABLED:-0}"
      PRERENDER_SERVICE_URL: "${PRERENDER_SERVICE_URL:-https://service.prerender.io}"
      PRERENDER_TOKEN: "${PRERENDER_TOKEN:-}"
      WEB_TRUSTED_PROXY_CIDR: "${WEB_TRUSTED_PROXY_CIDR:-172.30.127.1/32}"
      WEB_BACKUP_MAX_BODY_SIZE: "${WEB_BACKUP_MAX_BODY_SIZE:-1025m}"
    ports:
      - "127.0.0.1:${WEB_PORT:-1270}:8080"
    depends_on:
      api:
        condition: service_healthy
    volumes:
      - goblog_media_data:/usr/share/nginx/media:ro
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:8080/ || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 5s
    deploy:
      resources:
        limits:
          memory: 512M
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    labels:
      org.opencontainers.image.title: "Notes of Ashen"
    networks:
      app:
        ipv4_address: "${APP_WEB_IPV4_ADDRESS:-172.30.127.10}"

  api:
    image: notes-of-ashen-api:${IMAGE_TAG:-latest}
    build:
      context: .
      dockerfile: Dockerfile.api
    restart: unless-stopped
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
      config-check:
        condition: service_completed_successfully
    env_file:
      - "${APP_ENV_FILE:-.env}"
    environment:
      TZ: Asia/Shanghai
      APP_HOST: "${APP_HOST:-0.0.0.0}"
      APP_PORT: "19000"
      APP_TIMEOUT: "${APP_TIMEOUT:-610000}"
      APP_DATABASE_DSN: "${APP_DATABASE_DSN:?set APP_DATABASE_DSN in .env}"
      APP_DATABASE_MAX_OPEN_CONNS: "${APP_DATABASE_MAX_OPEN_CONNS:-20}"
      APP_DATABASE_MAX_IDLE_CONNS: "${APP_DATABASE_MAX_IDLE_CONNS:-10}"
      APP_AUTH_ACCESS_SECRET: "${APP_AUTH_ACCESS_SECRET:?set APP_AUTH_ACCESS_SECRET in .env}"
      APP_AUTH_ACCESS_EXPIRE: "${APP_AUTH_ACCESS_EXPIRE:-1800}"
      APP_AUTH_REFRESH_EXPIRE: "${APP_AUTH_REFRESH_EXPIRE:-604800}"
      APP_AUTH_COOKIE_SECURE: "${APP_AUTH_COOKIE_SECURE:-true}"
      APP_REDIS_ADDR: "${APP_REDIS_ADDR:?set APP_REDIS_ADDR in .env}"
      APP_REDIS_PASSWORD: "${APP_REDIS_PASSWORD:-}"
      APP_REDIS_DB: "${APP_REDIS_DB:-0}"
      APP_SEARCH_ENABLED: "${APP_SEARCH_ENABLED:-false}"
      APP_MEILISEARCH_HOST: "${APP_MEILISEARCH_HOST:-http://meilisearch:7700}"
      APP_MEILISEARCH_API_KEY: "${APP_MEILISEARCH_API_KEY:-}"
      APP_MEILISEARCH_INDEX: "${APP_MEILISEARCH_INDEX:-articles}"
      APP_RABBITMQ_ENABLED: "${APP_RABBITMQ_ENABLED:-false}"
      APP_RABBITMQ_USER: "${APP_RABBITMQ_USER:-notes_user}"
      APP_RABBITMQ_PASSWORD: "${APP_RABBITMQ_PASSWORD:-}"
      APP_RABBITMQ_URL: "${APP_RABBITMQ_URL:-}"
      APP_RABBITMQ_EXCHANGE: "${APP_RABBITMQ_EXCHANGE:-notes-of-ashen.events}"
      APP_RABBITMQ_QUEUE: "${APP_RABBITMQ_QUEUE:-notes-of-ashen.operation_logs}"
      APP_RABBITMQ_ROUTING_KEY: "${APP_RABBITMQ_ROUTING_KEY:-operation.log}"
      APP_EMAIL_ENABLED: "${APP_EMAIL_ENABLED:-false}"
      APP_EMAIL_SMTP_HOST: "${APP_EMAIL_SMTP_HOST:-smtp.qq.com}"
      APP_EMAIL_SMTP_PORT: "${APP_EMAIL_SMTP_PORT:-465}"
      APP_EMAIL_TLS_MODE: "${APP_EMAIL_TLS_MODE:-implicit}"
      APP_EMAIL_SMTP_USERNAME: "${APP_EMAIL_SMTP_USERNAME:-}"
      APP_EMAIL_SMTP_PASSWORD: "${APP_EMAIL_SMTP_PASSWORD:-}"
      APP_EMAIL_FROM: "${APP_EMAIL_FROM:-}"
      APP_EMAIL_FROM_NAME: "${APP_EMAIL_FROM_NAME:-Notes of Ashen}"
      APP_MEDIA_ROOT: "${APP_MEDIA_ROOT:-/data/media}"
      APP_MEDIA_MAX_UPLOAD_BYTES: "${APP_MEDIA_MAX_UPLOAD_BYTES:-10485760}"
      APP_BACKUP_MAX_UPLOAD_BYTES: "${APP_BACKUP_MAX_UPLOAD_BYTES:-1073741824}"
      APP_TRUSTED_PROXY_CIDRS: "${APP_TRUSTED_PROXY_CIDRS:-172.30.127.10/32}"
      COMPOSE_PROFILES: "${COMPOSE_PROFILES:-}"
    volumes:
      - goblog_media_data:/data/media
    expose:
      - "19000"
      - "9101"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:19000/healthz || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 10s
    deploy:
      resources:
        limits:
          memory: 1G
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    labels:
      org.opencontainers.image.title: "Notes of Ashen"
    networks:
      - app

  # 数据库迁移必须独立于 API 执行，避免多副本 API 在启动时竞争 DDL。
  # 成功退出后 Compose 才会允许 API 启动；失败时保留容器日志供排查。
  migrate:
    image: notes-of-ashen-api:${IMAGE_TAG:-latest}
    build:
      context: .
      dockerfile: Dockerfile.api
    restart: "no"
    depends_on:
      mysql:
        condition: service_healthy
      config-check:
        condition: service_completed_successfully
    env_file:
      - "${APP_ENV_FILE:-.env}"
    environment:
      TZ: Asia/Shanghai
      APP_DATABASE_DSN: "${APP_DATABASE_DSN:?set APP_DATABASE_DSN in .env}"
      APP_DATABASE_MAX_OPEN_CONNS: "${APP_DATABASE_MAX_OPEN_CONNS:-20}"
      APP_DATABASE_MAX_IDLE_CONNS: "${APP_DATABASE_MAX_IDLE_CONNS:-10}"
    command: ["-f", "/app/etc/notes-of-ashen.yaml", "-migrate-only"]
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    labels:
      org.opencontainers.image.title: "Notes of Ashen Database Migrations"
    networks:
      - app

  config-check:
    image: notes-of-ashen-api:${IMAGE_TAG:-latest}
    build:
      context: .
      dockerfile: Dockerfile.api
    restart: "no"
    env_file:
      - "${APP_ENV_FILE:-.env}"
    environment:
      TZ: Asia/Shanghai
      COMPOSE_PROFILES: "${COMPOSE_PROFILES:-}"
      APP_SEARCH_ENABLED: "${APP_SEARCH_ENABLED:-false}"
      APP_MEILISEARCH_HOST: "${APP_MEILISEARCH_HOST:-http://meilisearch:7700}"
      APP_MEILISEARCH_API_KEY: "${APP_MEILISEARCH_API_KEY:-}"
      APP_MEILISEARCH_INDEX: "${APP_MEILISEARCH_INDEX:-articles}"
      APP_RABBITMQ_ENABLED: "${APP_RABBITMQ_ENABLED:-false}"
      APP_RABBITMQ_USER: "${APP_RABBITMQ_USER:-notes_user}"
      APP_RABBITMQ_PASSWORD: "${APP_RABBITMQ_PASSWORD:-}"
      APP_RABBITMQ_URL: "${APP_RABBITMQ_URL:-}"
    command: ["-f", "/app/etc/notes-of-ashen.yaml", "-validate-optional-dependencies-only"]
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    labels:
      org.opencontainers.image.title: "Notes of Ashen Optional Dependency Validation"
    networks:
      - app

  mysql:
    image: mysql:8.4@sha256:c592c15aaf4a1961e15d82eb31ea5987dda862d1c4b1e93424438c0e91dc1f8d
    restart: unless-stopped
    environment:
      TZ: Asia/Shanghai
      MYSQL_ROOT_PASSWORD: "${APP_MYSQL_ROOT_PASSWORD:?set APP_MYSQL_ROOT_PASSWORD in .env}"
      MYSQL_DATABASE: "notes_of_ashen"
      MYSQL_USER: "${APP_MYSQL_USER:-notes_user}"
      MYSQL_PASSWORD: "${APP_MYSQL_PASSWORD:?set APP_MYSQL_PASSWORD in .env}"
    command:
      - mysqld
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_0900_ai_ci
    volumes:
      - goblog_mysql_data:/var/lib/mysql
    expose:
      - "3306"
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -u$$MYSQL_USER -p$$MYSQL_PASSWORD --silent"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s
    deploy:
      resources:
        limits:
          memory: 1G
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    labels:
      org.opencontainers.image.title: "Notes of Ashen MySQL"
    networks:
      - app

  redis:
    image: redis:7.4-alpine@sha256:6ab0b6e7381779332f97b8ca76193e45b0756f38d4c0dcda72dbb3c32061ab99
    restart: unless-stopped
    environment:
      REDIS_PASSWORD: "${APP_REDIS_PASSWORD:-}"
    command:
      - sh
      - -ec
      - |
        if [ -n "$$REDIS_PASSWORD" ]; then
          exec redis-server --appendonly yes --requirepass "$$REDIS_PASSWORD"
        fi
        exec redis-server --appendonly yes
    volumes:
      - goblog_redis_data:/data
    expose:
      - "6379"
    healthcheck:
      test:
        - CMD-SHELL
        - |
          if [ -n "$$REDIS_PASSWORD" ]; then
            REDISCLI_AUTH="$$REDIS_PASSWORD" redis-cli --raw ping | grep -qx PONG
          else
            redis-cli --raw ping | grep -qx PONG
          fi
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 5s
    deploy:
      resources:
        limits:
          memory: 512M
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    labels:
      org.opencontainers.image.title: "Notes of Ashen Redis"
    networks:
      - app

  rabbitmq:
    image: rabbitmq:4-management-alpine@sha256:0753b75ce99094c385483d89449d532a0544fb85e4942a478b21cc497ab66d33
    profiles: ["messaging"]
    restart: unless-stopped
    environment:
      TZ: Asia/Shanghai
      RABBITMQ_DEFAULT_USER: "${APP_RABBITMQ_USER:-notes_user}"
      # 留空仅允许默认 profile 跳过可选服务；启用 messaging 前必须在 .env 配置强密码。
      RABBITMQ_DEFAULT_PASS: "${APP_RABBITMQ_PASSWORD:-}"
    volumes:
      - goblog_rabbitmq_data:/var/lib/rabbitmq
    expose:
      - "5672"
      - "15672"
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s
    deploy:
      resources:
        limits:
          memory: 512M
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    labels:
      org.opencontainers.image.title: "Notes of Ashen RabbitMQ"
    networks:
      - app

  meilisearch:
    image: getmeili/meilisearch:v1.13@sha256:bed3fb650e62da53145777204891159242f6ea4ce69e215b36223af4aa64a0ae
    profiles: ["search"]
    restart: unless-stopped
    environment:
      MEILI_ENV: "${MEILI_ENV:-production}"
      MEILI_MASTER_KEY: "${APP_MEILISEARCH_API_KEY:-}"
      TZ: Asia/Shanghai
    volumes:
      - goblog_meili_data:/meili_data
    expose:
      - "7700"
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:7700/health | grep -q available"]
      interval: 10s
      timeout: 5s
      retries: 12
    deploy:
      resources:
        limits:
          memory: 512M
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    labels:
      org.opencontainers.image.title: "Notes of Ashen"
    networks:
      - app

volumes:
  goblog_mysql_data:
  goblog_redis_data:
  goblog_rabbitmq_data:
  goblog_meili_data:
  goblog_media_data:

networks:
  app:
    driver: bridge
    ipam:
      config:
        - subnet: "${APP_DOCKER_SUBNET:-172.30.127.0/24}"
